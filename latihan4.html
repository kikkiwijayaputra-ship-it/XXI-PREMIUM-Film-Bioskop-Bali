<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Akun Email</title>
    <link rel="stylesheet" href="latihan4.css">
</head>

<body>

    <div class="form-box">

        <div class="logo">Email</div>
        <h2>Buat Akun Email Anda</h2>

        <div class="group">
            <label for="nama">Nama lengkap</label>
            <input type="text" id="nama">
        </div>

        <div class="group">
            <label for="email">Email Baru</label>
            <div class="email">
                <input type="text" id="email">
                <span>@gmail.com</span>
            </div>
        </div>

        <div class="group">
            <label for="sandi">Kata Sandi</label>
            <input type="password" id="sandi">
        </div>

        <div class="group">
            <label>Tanggal Lahir</label>
            <div class="tgl">
                <label>Hari</label>
                <input type="date">

                </div>
                    
            

                <select>
                    <option>Bulan</option>
                    <option>Januari</option>
                    <option>Februari</option>
                    <option>Maret</option>
                    <option>April</option>
                    <option>Mei</option>        
                    <option>Juni</option>
                    <option>Juli</option>
                    <option>Agustus</option>
                    <option>September</option>
                    <option>Oktober</option>
                    <option>November</option>
                    <option>Desember</option>
                </select>

                <select>
                    <option>Tahun</option>
                    <option>2009</option>
                    <option>2010</option>
                    <option>2011</option>
                </select>
            </div>
        </div>

        <button>Lanjutkan</button>

        <small>
            Dengan mengeklik "Lanjutkan", Anda setuju dengan Persyaratan dan Kebijakan Privasi Email.
        </small>

</body>

</html>
