<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Form Kontak</title>
	<style>
		body{font-family:Segoe UI,Roboto,Arial,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;color:#222}
		header{display:flex;align-items:center;gap:12px}
		h1{margin:0;font-size:28px;color:#0b5}
		.card{background:#f7f7f7;border-radius:8px;padding:16px;margin-top:18px;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
		label{display:block;margin:8px 0 4px;font-weight:600}
		input,textarea,button{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px}
		button{background:#0b5;color:#fff;border:none;cursor:pointer;margin-top:8px}
	</style>
</head>
<body>
	<header>
		<h1>Tuliskan Pesan</h1>
	</header>

	<div class="card">
		<form id="contact">
			<label for="name">Nama</label>
			<input id="name" name="name" placeholder="Nama kamu" required>

			<label for="message">Pesan</label>
			<textarea id="message" name="message" rows="4" placeholder="Tulis pesan..." required></textarea>

			<button type="submit">Kirim</button>
		</form>

		<div id="output" style="margin-top:12px;display:none;padding:10px;background:#fff;border:1px solid #e6e6e6;border-radius:6px"></div>
	</div>

	<script>
		document.getElementById('contact').addEventListener('submit', function(e){
			e.preventDefault();
			var name = document.getElementById('name').value.trim();
			var msg = document.getElementById('message').value.trim();
			var out = document.getElementById('output');
			out.style.display = 'block';
			out.innerHTML = '<strong>Terima kasih, ' + (name || 'Anonim') + '!</strong><p>' + (msg || '') + '</p>';
			this.reset();
		});
	</script>
</body>
